<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattva - Scientific Name Explorer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef7f2; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #333;
        }
        
        .tattva-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border-top: 6px solid #2e7d32; 
        }
        
        h1 { color: #2e7d32; margin-bottom: 0.5rem; font-size: 2.2rem; }
        p.subtitle { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
        
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background-color: white;
        }
        input:focus, select:focus { border-color: #2e7d32; }
        
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #1b5e20; }
        
        #result-box {
            margin-top: 1.5rem;
            padding: 1.2rem;
            border-radius: 8px;
            display: none; 
            text-align: left;
        }
        .success { background-color: #f1f8e9; border: 1px solid #c5e1a5; }
        .error { background-color: #ffebee; border: 1px solid #ffcdd2; color: #c62828; text-align: center; }
        
        .result-label { font-size: 0.75rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        .result-value { font-size: 1.1rem; margin-bottom: 5px; color: #222; }
        .sci-name { font-style: italic; font-weight: bold; color: #2e7d32; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="tattva-card">
        <h1>Tattva</h1>
        <p class="subtitle">Discover the scientific names of nature.</p>
        
        <input type="text" id="searchInput" placeholder="e.g., Mango, Tiger, Sunflower..." onkeydown="if(event.key === 'Enter'){ findName(); }">
        
        <!-- New Category Dropdown -->
        <select id="categorySelect">
            <option value="">🌍 All Categories</option>
            <option value="6">🌿 Plants & Fruits</option>
            <option value="1">🐅 Animals & Insects</option>
            <option value="5">🍄 Fungi & Mushrooms</option>
        </select>

        <button onclick="findName()">Search Organism</button>

        <div id="result-box"></div>
    </div>

    <script>
        async function findName() {
            const query = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('categorySelect').value;
            const resultBox = document.getElementById('result-box');

            if (!query) {
                resultBox.style.display = 'block';
                resultBox.className = 'error';
                resultBox.innerHTML = "Please enter a name before searching.";
                return;
            }

            resultBox.style.display = 'block';
            resultBox.className = 'success';
            resultBox.innerHTML = "Searching nature's database...";

            try {
                // We start with the base URL
                let apiUrl = `https://api.gbif.org/v1/species/search?q=${encodeURIComponent(query)}&limit=1`;
                
                // If the user selected a category, we add the kingdom key to the URL
                if (category) {
                    apiUrl += `&kingdomKey=${category}`;
                }

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    resultBox.className = 'error';
                    resultBox.innerHTML = `No scientific name found for "<strong>${query}</strong>" in this category.`;
                } else {
                    const organism = data.results[0];
                    resultBox.className = 'success';
                    resultBox.innerHTML = `
                        <div class="result-label">Common Name Searched</div>
                        <div class="result-value">${query}</div>
                        
                        <div class="result-label">Scientific Name</div>
                        <div class="result-value sci-name">${organism.scientificName}</div>
                        
                        <div class="result-label">Taxonomic Rank</div>
                        <div class="result-value">${organism.rank || 'Unknown'}</div>
                        
                        <div class="result-label">Kingdom</div>
                        <div class="result-value">${organism.kingdom || 'Unknown'}</div>
                    `;
                }
            } catch (error) {
                resultBox.className = 'error';
                resultBox.innerHTML = "A network error occurred. Please check your internet connection.";
            }
        }
    </script>

</body>
</html>
